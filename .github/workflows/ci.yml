name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build de produção com configuração sintética
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_1234567890
          SUPABASE_SERVICE_ROLE_KEY: service_role_dummy_1234567890
          DATABASE_URL: postgresql://user:password@localhost:5432/lar_da_bencao
          CRON_SECRET: cron_dummy_123456789012345678901234567890
          BOOTSTRAP_SECRET: bootstrap_dummy_123456789012345678901234567890
          ANTIMALWARE_API_URL: https://scanner.example.test/scan
          ANTIMALWARE_API_TOKEN: scanner_dummy_1234567890
          APP_URL: https://app.example.test

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: lar_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar todas as migrações em banco vazio e validar privilégios
        run: scripts/db-test-setup.sh
        env:
          RUNTIME_PASSWORD: runtime_ci_password
      - name: Integração com Postgres real (login de runtime, sem credencial de produção)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://lar_runtime:runtime_ci_password@localhost:5432/lar_test
          TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/lar_test
